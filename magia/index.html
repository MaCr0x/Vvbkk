<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090b15">
  <title>Piensa un número</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #090b15;
      color: #f8f7ff;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(ellipse at 50% 35%, #202044 0%, #101323 42%, #090b15 78%);
    }
    main {
      width: min(100%, 520px);
      min-height: min(620px, calc(100svh - 48px));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: clamp(24px, 8vw, 48px);
      border: 1px solid rgb(255 255 255 / 10%);
      border-radius: 28px;
      background: rgb(17 20 39 / 72%);
      box-shadow: 0 24px 80px rgb(0 0 0 / 38%);
    }
    .eyebrow {
      margin: 0 0 22px;
      color: #b5aaff;
      font-size: .78rem;
      font-weight: 750;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(2.35rem, 11vw, 4.2rem);
      line-height: 1.08;
      letter-spacing: -.045em;
      text-wrap: balance;
    }
    .instruction {
      max-width: 19ch;
      min-height: 3.1em;
      margin: 26px 0 38px;
      color: #e0def0;
      font-size: clamp(1.45rem, 7vw, 2.2rem);
      line-height: 1.35;
      text-wrap: balance;
    }
    .start-title { margin-bottom: 42px; }
    button {
      min-width: min(100%, 220px);
      min-height: 64px;
      padding: 16px 30px;
      border: 0;
      border-radius: 18px;
      background: linear-gradient(135deg, #a996ff, #7863ef);
      color: #100d26;
      font: inherit;
      font-size: 1.2rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 30px rgb(123 99 239 / 30%);
      transition: transform 160ms ease, filter 160ms ease;
      -webkit-tap-highlight-color: transparent;
    }
    button:hover { filter: brightness(1.1); }
    button:active { transform: scale(.97); }
    button:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
    .reveal { animation: reveal 900ms cubic-bezier(.2,.8,.2,1) both; }
    .result {
      display: block;
      margin-top: 12px;
      color: #c3b6ff;
      font-size: clamp(5rem, 28vw, 9rem);
      line-height: 1;
      text-shadow: 0 0 42px rgb(171 150 255 / 65%);
    }
    @keyframes reveal {
      0% { opacity: 0; transform: scale(.55); }
      65% { opacity: 1; transform: scale(1.08); }
      100% { opacity: 1; transform: scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main id="app" aria-live="polite"></main>
  <script>
    (() => {
      const steps = [
        'Piensa un número del 1 al 10.',
        'Multiplícalo por 2.',
        'Súmale 10.',
        'Divide el resultado entre 2.',
        'Réstale el número que pensaste al principio.'
      ];
      const app = document.getElementById('app');
      let step = -1;

      function render() {
        if (step < 0) {
          app.innerHTML = `
            <p class="eyebrow">Un pequeño truco</p>
            <h1 class="start-title">Piensa un número</h1>
            <button type="button" id="start">Empezar</button>`;
          document.getElementById('start').addEventListener('click', () => {
            step = 0;
            render();
          });
          return;
        }

        if (step >= steps.length) {
          app.innerHTML = `
            <p class="eyebrow">Puedo leer tu mente</p>
            <h1 class="reveal">Tu número es...<span class="result">5</span></h1>
            <button type="button" id="again">Otra vez</button>`;
          document.getElementById('again').addEventListener('click', () => {
            step = -1;
            render();
          });
          return;
        }

        app.innerHTML = `
          <p class="eyebrow">Paso ${step + 1} de ${steps.length}</p>
          <h1 class="instruction">${steps[step]}</h1>
          <button type="button" id="next">Siguiente</button>`;
        document.getElementById('next').addEventListener('click', () => {
          step += 1;
          render();
        });
      }

      render();
    })();
  </script>
</body>
</html>
