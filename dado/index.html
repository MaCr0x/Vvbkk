<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10131d">
<title>Dado · Tirada</title>
<style>
:root{color-scheme:dark;--ink:#f7f5f0;--muted:#a6a9b5;--gold:#f3c66b;--panel:#1a1e2b;--size:clamp(112px,34vw,154px)}
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 50% 20%,#292d43 0,#171a27 39%,#0d1018 100%);color:var(--ink);font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center;overflow-x:hidden}
main{width:min(100%,560px);padding:clamp(24px,7vw,46px) 22px 36px;display:flex;flex-direction:column;align-items:center;text-align:center}.eyebrow{font-size:.72rem;font-weight:750;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin:0 0 9px}h1{font-size:clamp(2rem,8vw,2.8rem);letter-spacing:-.055em;margin:0;font-weight:800}.intro{color:var(--muted);margin:8px 0 0;font-size:.95rem}
.stage{width:100%;height:clamp(260px,72vw,340px);max-height:340px;position:relative;display:grid;place-items:center;perspective:900px;perspective-origin:50% 45%;touch-action:manipulation;cursor:pointer;outline:none}.stage:focus-visible{outline:2px solid var(--gold);outline-offset:-5px;border-radius:24px}.table{position:absolute;bottom:22px;left:9%;width:82%;height:28px;border-radius:50%;background:radial-gradient(ellipse,rgba(2,3,8,.66),rgba(3,4,9,.12) 70%,transparent 75%);filter:blur(5px);transform:scale(var(--shadow-scale,.78));transition:transform .1s ease-out}.cube-wrap{width:var(--size);height:var(--size);position:relative;transform-style:preserve-3d;will-change:transform;z-index:1}.cube{position:absolute;inset:0;transform-style:preserve-3d}.face{position:absolute;inset:0;border-radius:7px;border:1px solid rgba(255,255,255,.88);background:linear-gradient(145deg,#fff 0%,#f5f4f0 48%,#d8d8d6 100%);box-shadow:inset 5px 6px 12px rgba(255,255,255,.9),inset -8px -9px 17px rgba(47,48,58,.16);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:17%;backface-visibility:hidden}
.pip{width:100%;height:100%;display:grid;place-items:center}.pip:after{content:"";width:clamp(11px,3.5vw,15px);height:clamp(11px,3.5vw,15px);border-radius:50%;background:radial-gradient(circle at 34% 28%,#52535a 0,#24252b 56%,#111218 100%);box-shadow:inset 1px 1px 2px rgba(0,0,0,.5),0 1px 1px rgba(255,255,255,.5)}.face[data-v="1"] .pip:after{width:clamp(18px,5vw,23px);height:clamp(18px,5vw,23px);background:radial-gradient(circle at 35% 30%,#ee867d,#c83f46 67%,#8d242e)}
.face.front{transform:translateZ(calc(var(--size)/2))}.face.back{transform:rotateY(180deg) translateZ(calc(var(--size)/2))}.face.right{transform:rotateY(90deg) translateZ(calc(var(--size)/2))}.face.left{transform:rotateY(-90deg) translateZ(calc(var(--size)/2))}.face.top{transform:rotateX(90deg) translateZ(calc(var(--size)/2))}.face.bottom{transform:rotateX(-90deg) translateZ(calc(var(--size)/2))}
.dice-row{display:flex;align-items:center;justify-content:center;gap:clamp(24px,9vw,55px);position:relative;z-index:2}.die-item{--size:clamp(112px,34vw,154px);position:relative;width:var(--size);height:var(--size);perspective:900px}.die-item .table{width:120%;left:-10%;bottom:-46px}.die-item .cube-wrap{width:100%;height:100%}.die-item .face{border-radius:6px;padding:16%}
.stage.two .dice-row{gap:clamp(20px,8vw,42px)}.stage.two{height:clamp(270px,76vw,350px)}.stage.two .die-item{--size:clamp(106px,31vw,140px);width:var(--size);height:var(--size)}.stage.two .pip:after{width:clamp(9px,3vw,13px);height:clamp(9px,3vw,13px)}
.controls{width:100%;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}.roll{min-height:58px;min-width:min(100%,230px);padding:0 32px;border:0;border-radius:18px;background:linear-gradient(135deg,#ffda83,#e9ad45);color:#211a10;font:800 1.08rem inherit;font-size:1.08rem;font-weight:850;letter-spacing:.015em;box-shadow:0 7px 22px rgba(216,157,55,.25),inset 0 1px rgba(255,255,255,.7);cursor:pointer;touch-action:manipulation;transition:transform .15s,filter .15s}.roll:active{transform:translateY(2px) scale(.98)}.roll:disabled{filter:saturate(.55);cursor:wait}.toggle{display:flex;gap:3px;background:rgba(255,255,255,.075);border:1px solid rgba(255,255,255,.08);padding:4px;border-radius:14px}.toggle button{min-width:48px;min-height:44px;background:transparent;border:0;border-radius:10px;color:var(--muted);font:inherit;font-weight:750;cursor:pointer}.toggle button[aria-pressed="true"]{background:#34394b;color:#fff;box-shadow:0 2px 8px #090b12}
.result{height:85px;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:7px}.result-number{font-size:clamp(3.5rem,15vw,5rem);line-height:1;font-weight:900;letter-spacing:-.07em;color:#fff;text-shadow:0 4px 20px rgba(243,198,107,.26)}.result-number.pop{animation:pop .48s cubic-bezier(.2,.9,.3,1.35)}.result-detail{font-size:.85rem;color:var(--muted);font-weight:700}.hint{font-size:.8rem;color:#858998;margin:0 0 22px}.history{width:100%;background:linear-gradient(145deg,rgba(30,34,48,.82),rgba(21,24,35,.82));border:1px solid rgba(255,255,255,.07);border-radius:22px;padding:18px 18px 16px;text-align:left;box-shadow:0 14px 35px rgba(0,0,0,.15)}.history-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.history h2{margin:0;font-size:.9rem;letter-spacing:.02em}.stats{font-size:.76rem;color:var(--muted);text-align:right}.stats strong{color:#f0d7a5;font-weight:750}.chips{min-height:36px;display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:13px}.chip{min-width:34px;height:34px;padding:0 10px;display:grid;place-items:center;border-radius:11px;background:#292e3f;border:1px solid rgba(255,255,255,.06);font-size:.86rem;font-weight:800;color:#f8f3e9}.empty{font-size:.82rem;color:#878b99}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@keyframes pop{0%{transform:scale(.45);opacity:.4}65%{transform:scale(1.16);opacity:1}100%{transform:scale(1)}}
@media(max-width:380px){main{padding-left:16px;padding-right:16px}.history{padding:16px}.stage{height:258px}.stage.two{height:270px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body><main>
<p class="eyebrow">Un momento de suerte</p><h1>Tirada de dados</h1><p class="intro">Respira hondo y deja que el azar decida.</p>
<div class="stage" id="stage" role="button" tabindex="0" aria-label="Tocar para tirar los dados"><div class="table" id="shadow"></div><div class="dice-row" id="diceRow"></div></div>
<div class="controls"><button class="roll" id="roll" type="button">Tirar</button><div class="toggle" role="group" aria-label="Cantidad de dados"><button type="button" data-count="1" aria-pressed="true">1 dado</button><button type="button" data-count="2" aria-pressed="false">2 dados</button></div></div>
<div class="result" aria-live="polite" aria-atomic="true"><span class="result-number" id="result">—</span><span class="result-detail" id="detail"></span></div><p class="hint">También puedes agitar tu teléfono</p>
<section class="history" aria-label="Historial de tiradas"><div class="history-head"><h2>Últimas tiradas</h2><div class="stats">Total <strong id="total">0</strong> <span aria-hidden="true">·</span> Media <strong id="average">—</strong></div></div><div class="chips" id="history"><span class="empty">Tus tiradas aparecerán aquí</span></div></section>
<div class="sr-only" id="announcement" aria-live="polite"></div>
</main>
<script>
(()=>{'use strict';
const row=document.getElementById('diceRow'),stage=document.getElementById('stage'),button=document.getElementById('roll'),resultEl=document.getElementById('result'),detail=document.getElementById('detail'),historyEl=document.getElementById('history'),totalEl=document.getElementById('total'),averageEl=document.getElementById('average'),announcement=document.getElementById('announcement');
const faces=[['front',1],['back',6],['right',3],['left',4],['top',2],['bottom',5]];let count=1,busy=false,history=[],lastMotion=0,motionReady=false;
function makeDie(){const item=document.createElement('div');item.className='die-item';item.innerHTML='<div class="table"></div><div class="cube-wrap"><div class="cube"></div></div>';const cube=item.querySelector('.cube');for(const [side,n] of faces){const face=document.createElement('div');face.className='face '+side;face.dataset.v=n;for(let i=0;i<9;i++){const pip=document.createElement('span');pip.className='pip';face.appendChild(pip)}const positions={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]}[n];positions.forEach(i=>face.children[i].classList.add('on'));for(let i=0;i<9;i++)if(!face.children[i].classList.contains('on'))face.children[i].style.visibility='hidden';cube.appendChild(face)}item._cube=cube;item._table=item.querySelector('.table');return item}
let dice=[makeDie(),makeDie()];function renderDice(){row.replaceChildren(...dice.slice(0,count));stage.classList.toggle('two',count===2);stage.setAttribute('aria-label',count===1?'Tocar para tirar el dado':'Tocar para tirar los dos dados')};renderDice();
function random(n){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n}
function target(face){return {front:[0,0],back:[0,180],right:[0,-90],left:[0,90],top:[-90,0],bottom:[90,0]}[face]}
function faceFor(v){return faces.find(f=>f[1]===v)[0]}
function animateDie(item,value,duration){const face=faceFor(value),[tx,ty]=target(face),cube=item._cube;const sx=Number(item.dataset.x||0),sy=Number(item.dataset.y||0),rx=(random(2)?1:-1)*(3+random(3))*360,ry=(random(2)?1:-1)*(3+random(3))*360;const endX=tx+Math.round((sx-tx)/360)*360,endY=ty+Math.round((sy-ty)/360)*360;const anim=cube.animate([{transform:`rotateX(${sx}deg) rotateY(${sy}deg) translateY(0)`,'offset':0},{transform:`rotateX(${sx+rx*.62}deg) rotateY(${sy+ry*.62}deg) translateY(-105px)`,offset:.53},{transform:`rotateX(${endX}deg) rotateY(${endY}deg) translateY(9px)`,offset:.88},{transform:`rotateX(${endX}deg) rotateY(${endY}deg) translateY(0)`,offset:1}],{duration,easing:'cubic-bezier(.18,.76,.25,1)',fill:'forwards'});item._table.animate([{transform:'scale(.8)'},{transform:'scale(.38)',offset:.53},{transform:'scale(1.16)',offset:.88},{transform:'scale(.8)'}],{duration,easing:'ease-out'});return anim.finished.then(()=>{cube.style.transform=`rotateX(${endX}deg) rotateY(${endY}deg)`;item.dataset.x=endX;item.dataset.y=endY;anim.cancel()})}
async function enableMotion(){if(motionReady)return;motionReady=true;try{if(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function'){const permission=await DeviceMotionEvent.requestPermission();if(permission!=='granted')return}window.addEventListener('devicemotion',onMotion,{passive:true})}catch(_){}}
function onMotion(e){if(busy)return;const a=e.accelerationIncludingGravity;if(!a)return;const magnitude=Math.sqrt((a.x||0)**2+(a.y||0)**2+(a.z||0)**2);const now=Date.now();if(magnitude>23&&now-lastMotion>1300){lastMotion=now;roll()}}
async function roll(){if(busy)return;await enableMotion();busy=true;button.disabled=true;const values=Array.from({length:count},()=>random(6)+1);const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;try{await Promise.all(dice.slice(0,count).map(d=>animateDie(d,values.shift(),reduced?420:1360)))}catch(_){}// Derive the upward-facing result from the final cube orientation.
const landed=Array.from(dice.slice(0,count),d=>{const x=((Number(d.dataset.x)||0)%360+360)%360,y=((Number(d.dataset.y)||0)%360+360)%360;if(Math.abs(x-270)<1)return 2;if(Math.abs(x-90)<1)return 5;if(Math.abs(y-270)<1)return 3;if(Math.abs(y-90)<1)return 4;if(Math.abs(y-180)<1)return 6;return 1});const sum=landed.reduce((a,b)=>a+b,0);history.unshift({values:landed,sum});history=history.slice(0,10);updateHistory();resultEl.textContent=String(count===1?landed[0]:sum);resultEl.classList.remove('pop');void resultEl.offsetWidth;resultEl.classList.add('pop');detail.textContent=count===2?`suma · ${landed[0]} + ${landed[1]}`:'';announcement.textContent=count===1?`Resultado: ${landed[0]}`:`Resultados ${landed[0]} y ${landed[1]}, suma ${sum}`;if(navigator.vibrate)navigator.vibrate(35);button.disabled=false;busy=false}
function updateHistory(){historyEl.replaceChildren();if(!history.length){historyEl.innerHTML='<span class="empty">Tus tiradas aparecerán aquí</span>';totalEl.textContent='0';averageEl.textContent='—';return}history.forEach(h=>{const chip=document.createElement('span');chip.className='chip';chip.textContent=h.values.length===1?String(h.sum):`${h.values.join(' + ')} = ${h.sum}`;historyEl.appendChild(chip)});const total=history.reduce((a,h)=>a+h.sum,0);totalEl.textContent=String(total);averageEl.textContent=(total/history.length).toFixed(1).replace('.',',')}
button.addEventListener('click',roll);stage.addEventListener('click',roll);stage.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();roll()}});document.querySelectorAll('.toggle button').forEach(b=>b.addEventListener('click',()=>{if(busy)return;count=Number(b.dataset.count);document.querySelectorAll('.toggle button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));renderDice();detail.textContent=''}));
})();
</script></body></html>
